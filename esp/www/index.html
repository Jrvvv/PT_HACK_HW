<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>HALK Encoder</title>
  <style>
    :root {
      --bg0: #0c1210;
      --bg1: #14201a;
      --ink: #e8f5ec;
      --muted: #8aa394;
      --accent: #b8ff3c;
      --accent-dim: #6a9a22;
      --hot: #ff5a36;
      --ring: rgba(184, 255, 60, 0.28);
      --panel: rgba(20, 36, 28, 0.72);
      --display: "Gill Sans", "Trebuchet MS", "Century Gothic", sans-serif;
      --mono: "Cascadia Mono", "Consolas", "Menlo", monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      color: var(--ink);
      font-family: var(--mono);
      background:
        radial-gradient(1200px 700px at 15% -10%, #1d3a28 0%, transparent 55%),
        radial-gradient(900px 600px at 100% 20%, #2a1a12 0%, transparent 50%),
        linear-gradient(165deg, var(--bg0), var(--bg1) 55%, #0a0f0d);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(232, 245, 236, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(232, 245, 236, 0.03) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(circle at 50% 40%, black 20%, transparent 75%);
      opacity: 0.55;
    }

    .stage {
      position: relative;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 28px 20px 40px;
    }

    .shell {
      width: min(520px, 100%);
      display: grid;
      gap: 22px;
      justify-items: center;
      animation: rise 700ms cubic-bezier(.2,.8,.2,1) both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: none; }
    }

    .brand {
      text-align: center;
      letter-spacing: 0.18em;
    }

    .brand h1 {
      font-family: var(--display);
      font-weight: 800;
      font-size: clamp(2.6rem, 10vw, 4.2rem);
      line-height: 0.92;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: linear-gradient(180deg, #f4ffe8 10%, var(--accent) 70%, var(--accent-dim));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 40px rgba(184, 255, 60, 0.15);
    }

    .brand p {
      margin-top: 10px;
      color: var(--muted);
      font-size: 0.82rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .knob-wrap {
      position: relative;
      width: min(320px, 78vw);
      aspect-ratio: 1;
      touch-action: none;
      user-select: none;
      filter: drop-shadow(0 24px 40px rgba(0, 0, 0, 0.45));
    }

    .knob {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background:
        radial-gradient(circle at 35% 28%, #3a4f42 0%, #1a2620 42%, #0d1411 78%),
        conic-gradient(from 0deg, #1b2821, #2c3d33, #1b2821);
      border: 1px solid rgba(184, 255, 60, 0.22);
      box-shadow:
        inset 0 0 0 10px rgba(8, 12, 10, 0.55),
        inset 0 8px 18px rgba(255, 255, 255, 0.05),
        0 0 0 1px rgba(0, 0, 0, 0.4);
      transition: box-shadow 120ms ease, transform 80ms linear;
    }

    .knob.spinning {
      box-shadow:
        inset 0 0 0 10px rgba(8, 12, 10, 0.55),
        inset 0 8px 18px rgba(255, 255, 255, 0.05),
        0 0 0 1px rgba(0, 0, 0, 0.4),
        0 0 36px var(--ring);
    }

    .ticks {
      position: absolute;
      inset: 18px;
      border-radius: 50%;
      background:
        repeating-conic-gradient(
          from -2deg,
          rgba(232, 245, 236, 0.55) 0deg 1.2deg,
          transparent 1.2deg 15deg
        );
      -webkit-mask: radial-gradient(circle, transparent 63%, #000 64% 78%, transparent 79%);
      mask: radial-gradient(circle, transparent 63%, #000 64% 78%, transparent 79%);
      pointer-events: none;
      opacity: 0.55;
    }

    .pointer {
      position: absolute;
      left: 50%;
      top: 14%;
      width: 4px;
      height: 18%;
      margin-left: -2px;
      border-radius: 999px;
      background: linear-gradient(180deg, var(--accent), transparent);
      box-shadow: 0 0 12px rgba(184, 255, 60, 0.55);
      transform-origin: 50% 200%;
      pointer-events: none;
    }

    .hub {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 34%;
      aspect-ratio: 1;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      border: none;
      cursor: pointer;
      color: var(--ink);
      font: inherit;
      background:
        radial-gradient(circle at 40% 30%, #2d4035, #121a16 70%);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.08),
        0 0 0 3px rgba(184, 255, 60, 0.12),
        0 10px 20px rgba(0, 0, 0, 0.35);
      transition: transform 90ms ease, background 90ms ease, box-shadow 90ms ease;
    }

    .hub:active,
    .hub.down {
      transform: translate(-50%, -50%) scale(0.92);
      background: radial-gradient(circle at 40% 30%, #4a2a20, #1a100e 70%);
      box-shadow:
        inset 0 4px 10px rgba(0, 0, 0, 0.45),
        0 0 0 3px rgba(255, 90, 54, 0.35),
        0 0 28px rgba(255, 90, 54, 0.35);
    }

    .hub span {
      display: block;
      font-size: 0.68rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      opacity: 0.8;
    }

    .readout {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .meter {
      padding: 14px 16px;
      border-radius: 16px;
      background: var(--panel);
      border: 1px solid rgba(184, 255, 60, 0.14);
      backdrop-filter: blur(8px);
    }

    .meter label {
      display: block;
      color: var(--muted);
      font-size: 0.7rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .meter strong {
      font-family: var(--display);
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--accent);
    }

    .meter.hot strong { color: var(--hot); }

    .hint {
      color: var(--muted);
      font-size: 0.75rem;
      text-align: center;
      line-height: 1.5;
      max-width: 34ch;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #666;
      box-shadow: 0 0 0 0 rgba(184, 255, 60, 0.4);
    }

    .dot.live {
      background: var(--accent);
      animation: pulse 1.6s ease-out infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(184, 255, 60, 0.45); }
      70% { box-shadow: 0 0 0 10px rgba(184, 255, 60, 0); }
      100% { box-shadow: 0 0 0 0 rgba(184, 255, 60, 0); }
    }

    @media (max-width: 420px) {
      .readout { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="stage">
    <div class="shell">
      <header class="brand">
        <h1>HALK</h1>
        <p>encoder deck</p>
      </header>

      <div class="status"><span class="dot" id="dot"></span><span id="link">connecting</span></div>

      <div class="knob-wrap" id="wrap">
        <div class="knob" id="knob">
          <div class="ticks"></div>
          <div class="pointer" id="pointer"></div>
          <button class="hub" id="hub" type="button" aria-label="Press encoder"><span>push</span></button>
        </div>
      </div>

      <section class="readout">
        <div class="meter">
          <label>position</label>
          <strong id="pos">0</strong>
        </div>
        <div class="meter" id="btnMeter">
          <label>button</label>
          <strong id="btn">UP</strong>
        </div>
      </section>

      <p class="hint">Крути диск пальцем или колёсиком. Жми центр — как вал энкодера. Физический энкодер тоже двигает этот UI.</p>
    </div>
  </main>

  <script>
    const knob = document.getElementById("knob");
    const pointer = document.getElementById("pointer");
    const hub = document.getElementById("hub");
    const wrap = document.getElementById("wrap");
    const posEl = document.getElementById("pos");
    const btnEl = document.getElementById("btn");
    const btnMeter = document.getElementById("btnMeter");
    const dot = document.getElementById("dot");
    const link = document.getElementById("link");

    let position = 0;
    let pressed = false;
    let dragging = false;
    let lastAngle = null;
    let accum = 0;
    let ignoreServerUntil = 0;

    const DEG_PER_STEP = 18;

    function render() {
      const deg = position * DEG_PER_STEP;
      pointer.style.transform = `rotate(${deg}deg)`;
      knob.style.transform = `rotate(${deg * 0.15}deg)`;
      posEl.textContent = String(position);
      btnEl.textContent = pressed ? "DOWN" : "UP";
      btnMeter.classList.toggle("hot", pressed);
      hub.classList.toggle("down", pressed);
    }

    function setLive(ok) {
      dot.classList.toggle("live", ok);
      link.textContent = ok ? "live · esp32" : "reconnecting";
    }

    async function post(body) {
      ignoreServerUntil = Date.now() + 180;
      const res = await fetch("/api/input", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      if (!res.ok) throw new Error("bad");
      const data = await res.json();
      position = data.pos;
      pressed = !!data.pressed;
      render();
      setLive(true);
    }

    function angleFromEvent(e) {
      const r = wrap.getBoundingClientRect();
      const cx = r.left + r.width / 2;
      const cy = r.top + r.height / 2;
      const x = (e.clientX ?? e.touches[0].clientX) - cx;
      const y = (e.clientY ?? e.touches[0].clientY) - cy;
      return Math.atan2(y, x);
    }

    function onMove(e) {
      if (!dragging) return;
      const ang = angleFromEvent(e);
      if (lastAngle == null) {
        lastAngle = ang;
        return;
      }
      let d = ang - lastAngle;
      if (d > Math.PI) d -= Math.PI * 2;
      if (d < -Math.PI) d += Math.PI * 2;
      lastAngle = ang;
      accum += d * (180 / Math.PI);
      while (accum >= DEG_PER_STEP) {
        accum -= DEG_PER_STEP;
        position += 1;
        render();
        post({ delta: 1 }).catch(() => setLive(false));
      }
      while (accum <= -DEG_PER_STEP) {
        accum += DEG_PER_STEP;
        position -= 1;
        render();
        post({ delta: -1 }).catch(() => setLive(false));
      }
      knob.classList.add("spinning");
    }

    function endDrag() {
      dragging = false;
      lastAngle = null;
      accum = 0;
      knob.classList.remove("spinning");
    }

    wrap.addEventListener("pointerdown", (e) => {
      if (e.target === hub || hub.contains(e.target)) return;
      dragging = true;
      lastAngle = angleFromEvent(e);
      wrap.setPointerCapture(e.pointerId);
    });
    wrap.addEventListener("pointermove", onMove);
    wrap.addEventListener("pointerup", endDrag);
    wrap.addEventListener("pointercancel", endDrag);

    wrap.addEventListener("wheel", (e) => {
      e.preventDefault();
      const delta = e.deltaY > 0 ? 1 : -1;
      position += delta;
      render();
      post({ delta }).catch(() => setLive(false));
      knob.classList.add("spinning");
      clearTimeout(wrap._spinT);
      wrap._spinT = setTimeout(() => knob.classList.remove("spinning"), 180);
    }, { passive: false });

    function press(on) {
      pressed = on;
      render();
      post({ press: on }).catch(() => setLive(false));
    }

    hub.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      e.stopPropagation();
      press(true);
    });
    window.addEventListener("pointerup", () => {
      if (pressed) press(false);
    });

    async function poll() {
      try {
        const res = await fetch("/api/state");
        const data = await res.json();
        if (Date.now() >= ignoreServerUntil) {
          position = data.pos;
          pressed = !!data.pressed;
          render();
        }
        setLive(true);
      } catch (_) {
        setLive(false);
      }
    }

    render();
    poll();
    setInterval(poll, 80);
  </script>
</body>
</html>
